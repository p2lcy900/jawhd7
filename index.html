<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Majed.win</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #000;
            overflow-x: hidden;
            position: relative;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        .tilt-container {
            perspective: 1200px;
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
        }

        .profile-card {
            background: rgba(12, 12, 15, 0.55);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 18px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.08s ease-out;
            transform-style: preserve-3d;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .profile-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: 110px;
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: #1a1a1e;
        }
        
        .default-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #3a2e8a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 600;
            color: white;
            border: 2.5px solid rgba(255, 255, 255, 0.85);
        }

        .stats-row {
            display: flex;
            gap: 14px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 5px 14px;
            width: fit-content;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 450;
            font-size: 0.7rem;
        }
        .stat-item svg {
            width: 12px;
            height: 12px;
            stroke: rgba(255, 255, 255, 0.8);
        }

        .profile-right {
            flex: 1;
            min-width: 220px;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .username {
            font-size: 1.5rem;
            font-weight: 650;
            color: white;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            letter-spacing: -0.2px;
        }

        .premium-star {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(200, 200, 210, 0.85);
            border-radius: 50%;
            width: 26px;
            height: 26px;
        }
        .premium-star svg {
            width: 15px;
            height: 15px;
            fill: #2a2a2e;
        }

        .join-date {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.68rem;
            margin-bottom: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .info-card {
            background: rgba(88, 101, 242, 0.12);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 8px 16px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .info-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-icon {
            font-size: 22px;
            background: linear-gradient(135deg, #b8b8c8, #6b5b95);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .info-details {
            text-align: left;
        }
        .info-title {
            font-weight: 600;
            color: white;
            font-size: 0.85rem;
        }
        .info-sub {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.55);
        }
        .info-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 5px 16px;
            border-radius: 30px;
            color: white;
            font-weight: 500;
            font-size: 0.7rem;
            text-decoration: none;
            transition: 0.2s;
        }
        .info-button:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.97);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }
        .status-dot-dnd {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #ed4245;
        }
        .status-text-dnd {
            color: #ed4245;
            font-size: 0.65rem;
        }

        .avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
        }
        .avatar-small-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #3a2e8a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: white;
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin: 12px 0 6px;
            justify-content: flex-start;
        }
        .social-circle {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            padding: 7px;
            border-radius: 50%;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 38px;
            height: 38px;
            text-decoration: none;
        }
        .social-circle:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
        }
        .social-circle i {
            font-size: 18px;
        }

        .turnstile-container {
            position: fixed;
            bottom: 10px;
            left: 10px;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
            visibility: hidden;
        }

        .blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(18px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-direction: column;
            gap: 15px;
        }

        .click-text {
            font-size: 2.8rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
            letter-spacing: 6px;
            animation: pulse 1.5s infinite;
            font-family: monospace;
        }

        .click-sub {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1.5px;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.96);}
            50% { opacity: 1; transform: scale(1.03);}
            100% { opacity: 0.5; transform: scale(0.96);}
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 580px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 18px;
            }
            .social-links {
                justify-content: center;
            }
            .stats-row {
                justify-content: center;
            }
            .info-left {
                justify-content: center;
                flex-wrap: wrap;
            }
            .name-row {
                justify-content: center;
            }
            .info-card {
                justify-content: center;
            }
            .click-text {
                font-size: 2rem;
                letter-spacing: 4px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

    <div id="blurOverlay" class="blur-overlay">
        <div class="click-text">[ CLICK ]</div>
        <div class="click-sub">tap to enter</div>
    </div>

    <video class="bg-video" autoplay loop muted playsinline>
        <source src="https://r2.guns.lol/377979af-73ab-46c1-8e99-f1538c646952.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <audio id="bgAudio" loop preload="auto" style="display: none;">
        <source src="https://r2.guns.lol/a06ce1e1-fbb5-4d3b-a86c-a745e350802d.mp3" type="audio/mpeg">
    </audio>

    <div id="turnstile-widget" class="turnstile-container"></div>

    <div class="tilt-container" id="mainContent" style="opacity: 0; transition: opacity 0.4s ease;">
        <div class="profile-card" id="tiltCard">
            <div class="profile-left">
                <div id="avatarContainer">
                    <div class="default-avatar">M</div>
                </div>
                <div class="stats-row">
                    <div class="stat-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M12 9a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5 5 5 0 0 1 5-5 5 5 0 0 1 5 5 5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5z"/>
                        </svg>
                        <span id="viewCount">1726</span>
                    </div>
                    <div class="stat-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 10q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22"/>
                        </svg>
                        <span>US</span>
                    </div>
                </div>
            </div>

            <div class="profile-right">
                <div class="name-row">
                    <span class="username" id="displayName">lmajed</span>
                    <div class="premium-star">
                        <svg viewBox="0 0 24 24">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                        </svg>
                    </div>
                </div>
                <div class="join-date">joined 2002/04/17</div>

                <div class="info-card">
                    <div class="info-left">
                        <i class="fab fa-discord info-icon"></i>
                        <div class="info-details">
                            <div class="info-title">Reaper Community</div>
                            <div class="info-sub">397 online · 3.3K members</div>
                        </div>
                    </div>
                    <a class="info-button" href="https://discord.gg/d-h" target="_blank">Join</a>
                </div>

                <div class="info-card" id="personalDiscordCard">
                    <div class="info-left">
                        <div id="discordAvatarSmall">
                            <div class="avatar-small-placeholder">?</div>
                        </div>
                        <div class="info-details">
                            <div class="info-title" id="discordDisplayName">65u5</div>
                            <div class="info-sub" id="discordUsername">@65u5</div>
                            <div class="status-badge">
                                <span class="status-dot-dnd"></span>
                                <span class="status-text-dnd" id="discordStatus">DND</span>
                            </div>
                        </div>
                    </div>
                    <a class="info-button" href="https://discord.com/users/932784788534886410" target="_blank">Msg</a>
                </div>

                <div class="social-links">
                    <a class="social-circle" href="https://majed.win/" target="_blank">
                        <i class="fas fa-globe" style="color: #b0b0b0;"></i>
                    </a>
                    <a class="social-circle" href="https://youtube.com/@2002_Majed" target="_blank">
                        <i class="fab fa-youtube" style="color: #ff2a2a;"></i>
                    </a>
                    <a class="social-circle" href="https://tiktok.com/@majed.alshmry" target="_blank">
                        <i class="fab fa-tiktok"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function(){
            var overlay = document.getElementById('blurOverlay');
            var mainContent = document.getElementById('mainContent');
            var audioPlayer = document.getElementById('bgAudio');
            
            function removeOverlay(){
                if(overlay){
                    overlay.classList.add('hidden');
                    setTimeout(function(){
                        if(overlay && overlay.remove) overlay.remove();
                    }, 400);
                }
                if(mainContent) mainContent.style.opacity = '1';
                if(audioPlayer){
                    audioPlayer.volume = 0.4;
                    audioPlayer.play().catch(function(){});
                }
                document.removeEventListener('click', removeOverlay);
                document.removeEventListener('touchstart', removeOverlay);
                document.removeEventListener('keydown', removeOverlay);
            }
            
            document.addEventListener('click', removeOverlay);
            document.addEventListener('touchstart', removeOverlay);
            document.addEventListener('keydown', removeOverlay);
            
            var audioEl = document.getElementById('bgAudio');
            if(audioEl) audioEl.volume = 0.4;
            
            (function(){
                document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });
                document.addEventListener('copy', function(e){ e.preventDefault(); return false; });
                document.addEventListener('cut', function(e){ e.preventDefault(); return false; });
                document.addEventListener('paste', function(e){ e.preventDefault(); return false; });
                document.addEventListener('selectstart', function(e){ e.preventDefault(); return false; });
                document.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });
                document.addEventListener('keydown', function(e){
                    if(e.key === 'F12' || e.keyCode === 123){ e.preventDefault(); return false; }
                    if(e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')){ e.preventDefault(); return false; }
                    if(e.ctrlKey && e.key === 'u'){ e.preventDefault(); return false; }
                    if(e.ctrlKey && e.key === 's'){ e.preventDefault(); return false; }
                    if(e.ctrlKey && e.key === 'p'){ e.preventDefault(); return false; }
                    if(e.ctrlKey && e.key === 'c'){ e.preventDefault(); return false; }
                    if(e.ctrlKey && e.key === 'x'){ e.preventDefault(); return false; }
                    if(e.ctrlKey && e.key === 'v'){ e.preventDefault(); return false; }
                    if(e.ctrlKey && e.key === 'a'){ e.preventDefault(); return false; }
                    if(e.key === 'PrintScreen' || e.keyCode === 44){ e.preventDefault(); return false; }
                });
                document.body.style.userSelect = 'none';
                document.body.style.webkitUserSelect = 'none';
                document.body.style.msUserSelect = 'none';
                document.body.style.mozUserSelect = 'none';
            })();
            
            (function(){
                var base = "lmajed";
                var frames = ['/', '-', '\\', '|'];
                var step = 0, dir = 1, len = 1;
                setInterval(function(){
                    var ch = frames[step % frames.length];
                    if(dir === 1){
                        var txt = base.substring(0, len);
                        if(len < base.length) len++; else dir = -1;
                        document.title = "[ " + ch + " ] " + txt.padEnd(base.length, ' ') + " | Majed.win";
                    } else {
                        var txt = base.substring(0, len);
                        if(len > 1) len--; else dir = 1;
                        document.title = "[ " + ch + " ] " + txt.padEnd(base.length, ' ') + " | Majed.win";
                    }
                    step++;
                }, 120);
            })();
            
            var USER_ID = "932784788534886410";
            var refreshTimer;
            
            async function fetchUserData(){
                try{
                    var ctrl = new AbortController();
                    var timeout = setTimeout(() => ctrl.abort(), 7000);
                    var res = await fetch(`https://api.lanyard.rest/v1/users/${USER_ID}`, { signal: ctrl.signal });
                    clearTimeout(timeout);
                    if(res.ok){
                        var json = await res.json();
                        if(json.success && json.data){
                            var user = json.data.discord_user;
                            if(user){
                                var avatar = null;
                                var display = user.global_name || user.username || "65u5";
                                var tag = user.username || "65u5";
                                if(user.avatar){
                                    var ext = user.avatar.startsWith("a_") ? "gif" : "png";
                                    avatar = `https://cdn.discordapp.com/avatars/${USER_ID}/${user.avatar}.${ext}?size=128`;
                                }
                                return { avatar, display, tag };
                            }
                        }
                    }
                } catch(e){}
                try{
                    var res2 = await fetch(`https://japi.rest/discord/v1/user/${USER_ID}`);
                    if(res2.ok){
                        var json2 = await res2.json();
                        if(json2.data && json2.data.avatar){
                            var u = json2.data;
                            var ext = u.avatar.startsWith("a_") ? "gif" : "png";
                            var avatar = `https://cdn.discordapp.com/avatars/${USER_ID}/${u.avatar}.${ext}?size=128`;
                            var display = u.global_name || u.username || "65u5";
                            var tag = u.username || "65u5";
                            return { avatar, display, tag };
                        }
                    }
                } catch(e){}
                return { avatar: null, display: "65u5", tag: "65u5" };
            }
            
            async function updateProfile(){
                var data = await fetchUserData();
                var avatarContainer = document.getElementById('avatarContainer');
                if(avatarContainer){
                    if(data.avatar){
                        var existingImg = avatarContainer.querySelector('img');
                        if(existingImg){
                            if(existingImg.src !== data.avatar){
                                existingImg.src = data.avatar;
                            }
                        } else {
                            avatarContainer.innerHTML = `<img class="avatar" src="${data.avatar}" alt="avatar" draggable="false" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'default-avatar\'>${(data.display.charAt(0) || 'M').toUpperCase()}</div>';">`;
                        }
                    } else if(!avatarContainer.querySelector('.default-avatar')){
                        avatarContainer.innerHTML = `<div class="default-avatar">${(data.display.charAt(0) || 'M').toUpperCase()}</div>`;
                    }
                }
                var smallContainer = document.getElementById('discordAvatarSmall');
                if(smallContainer){
                    if(data.avatar){
                        var existingSmall = smallContainer.querySelector('img');
                        if(existingSmall){
                            if(existingSmall.src !== data.avatar){
                                existingSmall.src = data.avatar;
                            }
                        } else {
                            smallContainer.innerHTML = `<img class="avatar-small" src="${data.avatar}" alt="avatar" draggable="false" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'avatar-small-placeholder\'>${(data.display.charAt(0) || '?').toUpperCase()}</div>';">`;
                        }
                    } else if(!smallContainer.querySelector('.avatar-small-placeholder')){
                        smallContainer.innerHTML = `<div class="avatar-small-placeholder">${(data.display.charAt(0) || '?').toUpperCase()}</div>`;
                    }
                }
                var nameSpan = document.getElementById('discordDisplayName');
                var userSpan = document.getElementById('discordUsername');
                if(nameSpan && nameSpan.textContent !== data.display){
                    nameSpan.textContent = data.display;
                }
                if(userSpan && userSpan.textContent !== `@${data.tag}`){
                    userSpan.textContent = `@${data.tag}`;
                }
            }
            
            updateProfile();
            refreshTimer = setInterval(updateProfile, 15000);
        })();
        
        (function(){
            var card = document.getElementById('tiltCard');
            if(!card) return;
            var container = card.parentElement;
            var rect = container.getBoundingClientRect();
            window.addEventListener('resize', function(){ rect = container.getBoundingClientRect(); });
            container.addEventListener('mousemove', function(e){
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var cx = rect.width / 2;
                var cy = rect.height / 2;
                var rx = ((y - cy) / cy) * 10;
                var ry = ((x - cx) / cx) * 10;
                card.style.transform = `perspective(1000px) rotateX(${-rx}deg) rotateY(${ry}deg) translateZ(3px)`;
            });
            container.addEventListener('mouseleave', function(){
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
            });
        })();
    </script>
</body>
</html>
