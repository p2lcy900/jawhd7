<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eng.Majed | Security Specialist</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --font-main: 'Consolas', 'Monaco', 'Lucida Console', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* Splash Screen for Audio Autoplay Bypass */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: pointer;
            text-align: center;
        }

        #splash-screen p {
            font-size: 1.2rem;
            letter-spacing: 5px;
            animation: pulse 1.5s infinite;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* Video Background Overlay */
        .video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #000;
            display: none;
        }

        .video-bg-container iframe {
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            filter: brightness(0.3) contrast(1.2);
            object-fit: cover;
        }

        /* Terminal Screen */
        #terminal-screen {
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            padding: 40px;
            height: 100vh;
            width: 100vw;
            background: black;
            z-index: 100;
            position: relative;
            overflow-y: auto;
        }

        .terminal-line {
            margin-bottom: 4px;
            font-size: 16px;
            line-height: 1.4;
            min-height: 1.4em;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: var(--text-color);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Profile Screen */
        #profile-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            opacity: 0;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px solid #fff;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            object-fit: cover;
        }

        .profile-info h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .profile-info p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 8px;
            font-weight: 300;
        }

        /* Hidden Audio Div */
        #audio-player {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen" onclick="initializeProject()">
        <p>[ CLICK TO INITIALIZE SYSTEM ]</p>
    </div>

    <!-- YouTube IFrame API Container -->
    <div id="audio-player"></div>

    <!-- Video Background Container -->
    <div class="video-bg-container" id="bg-video-container"></div>

    <!-- Terminal Screen -->
    <div id="terminal-screen">
        <div id="terminal-content"></div>
        <div id="cursor-line"><span class="cursor"></span></div>
    </div>

    <!-- Profile Screen -->
    <div id="profile-screen">
        <img src="https://cdn.discordapp.com/attachments/1487634339121594451/1490407568391274770/773ce0527e5ab3c4aa02c663706ccca6.jpg?ex=69d3f1b6&is=69d2a036&hm=e8889e8374872ceb65eaccec5a5edc8615b63b86274a9273082ec7ab897c2583&" alt="Eng.Majed" class="profile-img">
        <div class="profile-info">
            <h1>Eng.Majed</h1>
            <p>Social Engineering Specialist</p>
            <p>Network Security Specialist</p>
            <p>6 Months Marketing Experience</p>
        </div>
    </div>

    <!-- YouTube API Script (Optional but good to keep for structure) -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        const videoId = '91GTuZWCQmY'; 

        const terminalContent = document.getElementById('terminal-content');
        const terminalScreen = document.getElementById('terminal-screen');
        const profileScreen = document.getElementById('profile-screen');
        const videoBgContainer = document.getElementById('bg-video-container');
        const splashScreen = document.getElementById('splash-screen');

        const lines = [
            { text: "echo you are now root.", delay: 800 },
            { text: "EchO; OK daddy .", delay: 1000 },
            { text: "", delay: 500 },
            { text: "root show Eng.Majed Info.", delay: 800 },
            { text: "EchO; print( 'Identity,Verified' ).", delay: 600 },
            { text: ".Hello ,", delay: 300 },
            { text: ".I'm Eng.Majed", delay: 300 },
            { text: ".Social Engineering Specialist", delay: 300 },
            { text: ".Network Security Specialist", delay: 300 },
            { text: ".I have six months of experience in marketing", delay: 300 },
            { text: "", delay: 500 },
            { text: "echo Anything else?", delay: 800 },
            { text: "EchO; System Will Load Profile in 3 Secound...", delay: 600 },
            { text: "", delay: 400 },
            { text: "1", delay: 1000 },
            { text: "2", delay: 1000 },
            { text: "3", delay: 1000 }
        ];

        let lineIndex = 0;

        // Simplified YouTube API Ready Callback
        function onYouTubeIframeAPIReady() {
            console.log("YouTube API Loaded");
        }

        function initializeProject() {
            splashScreen.style.display = 'none';
            terminalScreen.style.display = 'flex';

            // Get Origin safely for YouTube API
            let origin = window.location.origin;
            if (origin === 'null' || !origin.startsWith('http')) {
                origin = '*'; // Handle local files
            }

            // Direct injection of the audio player after user interaction (Most Reliable)
            const audioDiv = document.getElementById('audio-player');
            const audioSrc = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&enablejsapi=1&origin=${encodeURIComponent(origin)}`;
            
            audioDiv.innerHTML = `<iframe 
                 id="youtube-player-iframe"
                 width="640" height="360" 
                 src="${audioSrc}" 
                 frameborder="0" 
                 allow="autoplay; encrypted-media" 
                 style="position: fixed; top: -1000px; left: -1000px; opacity: 0.01; pointer-events: none;"></iframe>`;

            console.log("Audio Player Injected:", audioSrc);

            typeLine();
        }

        function typeLine() {
            if (lineIndex < lines.length) {
                const lineData = lines[lineIndex];
                const lineDiv = document.createElement('div');
                lineDiv.className = 'terminal-line';
                terminalContent.appendChild(lineDiv);
                
                terminalScreen.scrollTop = terminalScreen.scrollHeight;

                let charCount = 0;
                const text = lineData.text;
                
                if (text === "") {
                    lineIndex++;
                    setTimeout(typeLine, lineData.delay);
                    return;
                }

                const charInterval = setInterval(() => {
                    if (charCount < text.length) {
                        lineDiv.textContent += text[charCount];
                        charCount++;
                        terminalScreen.scrollTop = terminalScreen.scrollHeight;
                    } else {
                        clearInterval(charInterval);
                        lineIndex++;
                        setTimeout(typeLine, lineData.delay);
                    }
                }, 40);
            } else {
                setTimeout(transitionToProfile, 1000);
            }
        }

        function transitionToProfile() {
            terminalScreen.style.transition = "opacity 0.8s ease";
            terminalScreen.style.opacity = "0";
            
            setTimeout(() => {
                terminalScreen.style.display = "none";
                videoBgContainer.style.display = "block";
                profileScreen.style.display = "flex";
                
                let origin = window.location.origin;
                if (origin === 'null' || !origin.startsWith('http')) {
                    origin = '*';
                }
                
                // Muted background video (Inject after terminal for performance)
                videoBgContainer.innerHTML = `<iframe 
                    width="100%" height="100%" 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&showinfo=0&autohide=1&enablejsapi=1&origin=${encodeURIComponent(origin)}" 
                    frameborder="0" 
                    allow="autoplay; encrypted-media"></iframe>`;

                setTimeout(() => {
                    profileScreen.style.transition = "opacity 1.2s ease";
                    profileScreen.style.opacity = "1";
                }, 100);
            }, 800);
        }
    </script>
</body>
</html>
