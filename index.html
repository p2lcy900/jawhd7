    <script>
        (function() {
            var video = document.getElementById('bgVideo');
            video.muted = false;
            video.play().catch(function(e) { console.log("Autoplay blocked, click anywhere to enable sound"); });

            document.body.addEventListener('click', function() {
                if (video.muted) {
                    video.muted = false;
                }
                if (video.paused) {
                    video.play().catch(function(e) {});
                }
            });

            var TARGET_SEC = 165;
            setInterval(function() {
                if (video.currentTime >= TARGET_SEC) {
                    video.currentTime = 0;
                    video.play().catch(function(e) {});
                }
            }, 500);

            document.getElementById('browser').innerText = navigator.userAgent;
            document.getElementById('timestamp').innerText = new Date().toLocaleString();

            var elements = {
                ip: document.getElementById('ip'),
                isp: document.getElementById('isp'),
                connection: document.getElementById('connection'),
                location: document.getElementById('location'),
                coords: document.getElementById('coords'),
                countryCode: document.getElementById('countryCode'),
                postal: document.getElementById('postal'),
                timezone: document.getElementById('timezone'),
                asn: document.getElementById('asn')
            };

            var currentIP = null;

            function getIPviaWebRTC() {
                return new Promise(function(resolve, reject) {
                    var pc = new RTCPeerConnection({ iceServers: [] });
                    pc.createDataChannel('');
                    pc.createOffer().then(function(offer) {
                        pc.setLocalDescription(offer);
                    }).catch(reject);
                    
                    pc.onicecandidate = function(ice) {
                        if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                        var ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
                        var match = ipRegex.exec(ice.candidate.candidate);
                        if (match && match[1]) {
                            pc.close();
                            resolve(match[1]);
                        }
                    };
                    
                    setTimeout(function() {
                        pc.close();
                        reject(new Error('WebRTC timeout'));
                    }, 3000);
                });
            }

            function getIPviaFreeAPI() {
                return fetch('https://api.ipify.org?format=json')
                    .then(function(res) { return res.json(); })
                    .then(function(data) { return data.ip; });
            }

            function getIPAddress() {
                var methods = [getIPviaWebRTC, getIPviaFreeAPI];
                var currentIndex = 0;
                
                function tryNextMethod() {
                    if (currentIndex >= methods.length) {
                        elements.ip.innerText = 'Failed to fetch';
                        return;
                    }
                    
                    var method = methods[currentIndex];
                    currentIndex++;
                    
                    method().then(function(ip) {
                        if (ip && ip !== '0.0.0.0' && ip !== '127.0.0.1') {
                            currentIP = ip;
                            elements.ip.innerText = ip;
                            getAllIPDetails(ip);
                        } else {
                            tryNextMethod();
                        }
                    }).catch(function() {
                        tryNextMethod();
                    });
                }
                
                tryNextMethod();
            }

            function getAllIPDetails(ip) {
                var geoAPIs = [
                    {
                        url: 'https://ipapi.co/' + ip + '/json/',
                        parser: function(data) {
                            if (data && !data.error) {
                                return {
                                    isp: data.org || null,
                                    connection: null,
                                    location: (data.city ? data.city + ', ' : '') + (data.region ? data.region + ', ' : '') + (data.country_name ? data.country_name : ''),
                                    coords: (data.latitude && data.longitude) ? data.latitude + ', ' + data.longitude : null,
                                    countryCode: data.country_code || null,
                                    postal: data.postal || null,
                                    timezone: data.timezone || null,
                                    asn: data.asn ? 'AS' + data.asn : null
                                };
                            }
                            return null;
                        }
                    },
                    {
                        url: 'https://ipwho.is/' + ip,
                        parser: function(data) {
                            if (data && data.success !== false) {
                                var connectionType = 'Unknown';
                                if (data.type) connectionType = data.type;
                                else if (data.proxy) connectionType = 'Proxy/VPN';
                                else if (data.hosting) connectionType = 'Hosting/Server';
                                else connectionType = 'Residential';
                                
                                return {
                                    isp: data.isp || null,
                                    connection: connectionType,
                                    location: (data.city ? data.city + ', ' : '') + (data.region ? data.region + ', ' : '') + (data.country ? data.country : ''),
                                    coords: (data.latitude && data.longitude) ? data.latitude + ', ' + data.longitude : null,
                                    countryCode: data.country_code || null,
                                    postal: data.postal || null,
                                    timezone: data.timezone?.name || null,
                                    asn: data.asn ? 'AS' + data.asn : null
                                };
                            }
                            return null;
                        }
                    },
                    {
                        url: 'https://ipinfo.io/' + ip + '/json',
                        parser: function(data) {
                            if (data && !data.error) {
                                return {
                                    isp: data.org || null,
                                    connection: null,
                                    location: (data.city ? data.city + ', ' : '') + (data.region ? data.region + ', ' : '') + (data.country ? data.country : ''),
                                    coords: data.loc ? data.loc.replace(',', ', ') : null,
                                    countryCode: data.country || null,
                                    postal: data.postal || null,
                                    timezone: data.timezone || null,
                                    asn: null
                                };
                            }
                            return null;
                        }
                    }
                ];

                var apiIndex = 0;
                var dataFound = {
                    isp: false,
                    connection: false,
                    location: false,
                    coords: false,
                    countryCode: false,
                    postal: false,
                    timezone: false,
                    asn: false
                };

                function updateField(field, value) {
                    if (value && !dataFound[field]) {
                        elements[field].innerText = value;
                        dataFound[field] = true;
                    }
                }

                function tryNextAPI() {
                    if (apiIndex >= geoAPIs.length) {
                        var defaults = {
                            isp: 'Unknown',
                            connection: 'Unknown',
                            location: 'Unknown',
                            coords: 'Not available',
                            countryCode: 'Unknown',
                            postal: 'Unknown',
                            timezone: 'Unknown',
                            asn: 'Unknown'
                        };
                        for (var key in defaults) {
                            if (!dataFound[key] && elements[key].innerText === 'Loading...') {
                                elements[key].innerText = defaults[key];
                            }
                        }
                        return;
                    }

                    var api = geoAPIs[apiIndex];
                    apiIndex++;

                    fetch(api.url)
                        .then(function(res) { return res.json(); })
                        .then(function(data) {
                            var result = api.parser(data);
                            if (result) {
                                updateField('isp', result.isp);
                                updateField('connection', result.connection);
                                updateField('location', result.location);
                                updateField('coords', result.coords);
                                updateField('countryCode', result.countryCode);
                                updateField('postal', result.postal);
                                updateField('timezone', result.timezone);
                                updateField('asn', result.asn);
                            }
                            tryNextAPI();
                        })
                        .catch(function() {
                            tryNextAPI();
                        });
                }

                tryNextAPI();
            }

            getIPAddress();

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        var gps = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
                        if (elements.coords.innerText === 'Loading...' || elements.coords.innerText === 'Not available') {
                            elements.coords.innerText = gps + ' (GPS)';
                        } else if (elements.coords.innerText.indexOf('GPS') === -1) {
                            elements.coords.innerText = elements.coords.innerText + ' | GPS: ' + gps;
                        }
                    },
                    function(err) {
                        console.log("Geolocation denied");
                        if (elements.coords.innerText === 'Loading...') {
                            elements.coords.innerText = 'Not available';
                        }
                    }
                );
            } else {
                if (elements.coords.innerText === 'Loading...') {
                    elements.coords.innerText = 'Not available';
                }
            }

            setTimeout(function() {
                if (elements.ip.innerText === 'Loading...') {
                    elements.ip.innerText = 'Failed to fetch';
                }
                var defaults = ['isp', 'connection', 'location', 'countryCode', 'postal', 'timezone', 'asn'];
                for (var i = 0; i < defaults.length; i++) {
                    if (elements[defaults[i]].innerText === 'Loading...') {
                        elements[defaults[i]].innerText = 'Unknown';
                    }
                }
            }, 12000);
        })();
    </script>
