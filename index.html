<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Majed.win</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0f1117 0%, #1a1e2c 100%);
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .profile-card {
      max-width: 560px;
      width: 100%;
      background: rgba(24, 25, 28, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      border: 1px solid rgba(114, 137, 218, 0.3);
    }

    .header {
      background: #1e1f24;
      padding: 1rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2c2f36;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ffffff, #b9bbbe);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .live-badge {
      background: #23a55a20;
      padding: 0.3rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #23a55a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #23a55a;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.8);}
      100% { opacity: 1; transform: scale(1.2);}
    }

    .profile-content {
      padding: 2rem 1.8rem;
    }

    .avatar-section {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(79, 84, 92, 0.4);
    }

    .avatar-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #5865f2;
      background: #2c2f33;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .default-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5865f2, #3b46b0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: bold;
      color: white;
      border: 3px solid #5865f2;
    }

    .user-info h2 {
      color: white;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 0.25rem;
    }

    .user-id {
      color: #b5bac1;
      font-family: monospace;
      font-size: 0.8rem;
      background: #111214;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      display: inline-block;
    }

    .status-container {
      background: #111214;
      border-radius: 1.5rem;
      padding: 1rem 1.2rem;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #2c2f36;
    }

    .status-label {
      color: #a3a6aa;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .status-value {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #f2f3f5;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.dnd { background: #ed4245; box-shadow: 0 0 6px #ed4245; }

    .platforms-section {
      margin: 1.5rem 0;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #80848e;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .platforms-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .platform-link {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1e1f24;
      padding: 12px 18px;
      border-radius: 1.2rem;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 1px solid #2c2f36;
    }

    .platform-link:hover {
      background: #2c2f36;
      transform: translateX(4px);
      border-color: #5865f2;
    }

    .platform-icon {
      width: 36px;
      height: 36px;
      background: #111214;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: white;
    }

    .platform-info {
      flex: 1;
    }

    .platform-name {
      font-size: 0.8rem;
      color: #a3a6aa;
      letter-spacing: 0.5px;
    }

    .platform-handle {
      font-weight: 600;
      color: #f2f3f5;
      font-size: 0.9rem;
      word-break: break-all;
    }

    .arrow-icon {
      color: #5865f2;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .footer {
      background: #111214cc;
      padding: 0.8rem 1.5rem;
      border-top: 1px solid #2c2f36;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 0.7rem;
      color: #6c707a;
    }

    .loading-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 2rem;
      color: #b5bac1;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #2c2f36;
      border-top: 3px solid #5865f2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 500px) {
      .profile-content { padding: 1.5rem; }
      .avatar-img, .default-avatar { width: 70px; height: 70px; }
      .user-info h2 { font-size: 1.3rem; }
    }

    .hidden-id {
      display: none;
    }
  </style>
</head>
<body>

<div class="profile-card">
  <div class="header">
    <h1><i class="fab fa-discord" style="margin-left: 6px;"></i>Profile</h1>
    <div class="live-badge">
      <span class="live-dot"></span>
      <span>Live</span>
    </div>
  </div>

  <div class="profile-content" id="profileContent">
    <div class="loading-box">
      <div class="spinner"></div>
      <span>profile...</span>
    </div>
  </div>

  <div class="footer">
  </div>
</div>

<script>
  const USER_ID = "932784788534886410";
  const FORCED_STATUS = "dnd";
  const FORCED_STATUS_TEXT = "Do Not Disturb";
  
  const SOCIAL_LINKS = [
    {
      name: "YouTube",
      icon: "fab fa-youtube",
      url: "https://www.youtube.com/@2002_Majed",
      handle: "@2002_Majed"
    },
    {
      name: "TikTok",
      icon: "fab fa-tiktok",
      url: "https://www.tiktok.com/@majed.alshmry",
      handle: "@majed.alshmry"
    },
    {
      name: "Discord",
      icon: "fab fa-discord",
      url: "https://discord.com/users/932784788534886410",
      handle: "65u5"
    }
  ];

  let refreshInterval;
  const profileContainer = document.getElementById("profileContent");

  async function fetchAvatarAndName() {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      
      const response = await fetch(`https://api.lanyard.rest/v1/users/${USER_ID}`, {
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      
      if (response.ok) {
        const json = await response.json();
        if (json.success && json.data) {
          const lanyardUserData = json.data.discord_user;
          if (lanyardUserData) {
            let avatarUrl = null;
            let displayName = lanyardUserData.global_name || lanyardUserData.username || "65u5";
            let usernameTag = lanyardUserData.username || "65u5";
            
            if (lanyardUserData.avatar) {
              const ext = lanyardUserData.avatar.startsWith("a_") ? "gif" : "png";
              avatarUrl = `https://cdn.discordapp.com/avatars/${USER_ID}/${lanyardUserData.avatar}.${ext}?size=128`;
            }
            return { avatarUrl, displayName, usernameTag };
          }
        }
      }
    } catch (e) {
      console.warn("Lanyard fetch failed", e);
    }
    
    try {
      const res = await fetch(`https://japi.rest/discord/v1/user/${USER_ID}`);
      if (res.ok) {
        const json = await res.json();
        if (json.data && json.data.avatar) {
          const user = json.data;
          const ext = user.avatar.startsWith("a_") ? "gif" : "png";
          const avatarUrl = `https://cdn.discordapp.com/avatars/${USER_ID}/${user.avatar}.${ext}?size=128`;
          const displayName = user.global_name || user.username || "65u5";
          const usernameTag = user.username || "65u5";
          return { avatarUrl, displayName, usernameTag };
        }
      }
    } catch (e) {}
    
    return { avatarUrl: null, displayName: "65u5", usernameTag: "65u5" };
  }

  async function renderProfile() {
    profileContainer.innerHTML = `<div class="loading-box"><div class="spinner"></div><span>Updating...</span></div>`;
    
    let avatarUrl = null;
    let displayName = "65u5";
    let usernameTag = "65u5";
    
    const userData = await fetchAvatarAndName();
    
    if (userData) {
      avatarUrl = userData.avatarUrl;
      displayName = userData.displayName;
      usernameTag = userData.usernameTag;
    }
    
    const avatarHTML = avatarUrl 
      ? `<img class="avatar-img" src="${avatarUrl}" alt="avatar" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'default-avatar\'>${displayName.charAt(0)}</div>';">`
      : `<div class="default-avatar">${displayName.charAt(0)}</div>`;
    
    const platformsHTML = SOCIAL_LINKS.map(platform => `
      <a href="${platform.url}" target="_blank" rel="noopener noreferrer" class="platform-link">
        <div class="platform-icon">
          <i class="${platform.icon}"></i>
        </div>
        <div class="platform-info">
          <div class="platform-name">${platform.name}</div>
          <div class="platform-handle">${platform.handle}</div>
        </div>
        <div class="arrow-icon">
          <i class="fas fa-arrow-left"></i>
        </div>
      </a>
    `).join('');
    
    const finalHtml = `
      <div class="avatar-section">
        ${avatarHTML}
        <div class="user-info">
          <h2>${escapeHtml(displayName)}</h2>
          <div class="user-id">@${escapeHtml(usernameTag)}</div>
        </div>
      </div>

      <div class="status-container">
        <span class="status-label">Account Status</span>
        <div class="status-value">
          <span class="status-dot dnd"></span>
          <span>${FORCED_STATUS_TEXT}</span>
        </div>
      </div>

      <div class="platforms-section">
        <div class="section-title">
          Connected Platforms
        </div>
        <div class="platforms-grid">
          ${platformsHTML}
        </div>
      </div>
    `;
    
    profileContainer.innerHTML = finalHtml;
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function startAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
    renderProfile();
    refreshInterval = setInterval(() => {
      renderProfile();
    }, 15000);
  }
  
  startAutoRefresh();
</script>

</body>
</html>
