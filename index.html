            const _loadViews=()=>{fetch(_URL,{headers:{'X-Master-Key':_API_KEY}}).then(r=>r.json()).then(d=>{if(d.record&&typeof d.record.views==='number'){_views=d.record.views;document.getElementById('viewCount').textContent=_views;document.getElementById('viewCount').classList.remove('views-loading')}}).catch(()=>{document.getElementById('viewCount').textContent='0'})};
            const _incViews=()=>{fetch(_URL,{headers:{'X-Master-Key':_API_KEY}}).then(r=>r.json()).then(g=>{const _curr=g.record.views||0;const _dev=_getDevice();const _list=g.record.viewed_devices||[];if(_list.includes(_dev)){_views=_curr;document.getElementById('viewCount').textContent=_views;return}
            const _new=_curr+1;_list.push(_dev);fetch(_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':_API_KEY},body:JSON.stringify({views:_new,viewed_devices:_list})}).then(()=>{_views=_new;document.getElementById('viewCount').textContent=_views})}).catch(e=>console.error(e))};
            window.onHumanVerified=()=>{if(!_counted){_counted=true;_incViews()}};_loadViews();
            if(window.turnstile){turnstile.ready(()=>{turnstile.render('.cf-turnstile',{sitekey:'0x4AAAAAAAgU7T2niLQD-TLm',callback:'onHumanVerified',theme:'dark'})})}
        })();
        (function(){const _card=document.getElementById('tiltCard');if(!_card)return;const _cont=_card.parentElement;let _b=_cont.getBoundingClientRect();window.addEventListener('resize',()=>{_b=_cont.getBoundingClientRect()});_cont.addEventListener('mousemove',(e)=>{const x=e.clientX-_b.left,y=e.clientY-_b.top,cx=_b.width/2,cy=_b.height/2,rx=((y-cy)/cy)*12,ry=((x-cx)/cx)*12;_card.style.transform=`perspective(1200px) rotateX(${-rx}deg) rotateY(${ry}deg) translateZ(4px)`});_cont.addEventListener('mouseleave',()=>{_card.style.transform='perspective(1200px) rotateX(0deg) rotateY(0deg) translateZ(0px)'})})();
    </script>
</body>
</html>
